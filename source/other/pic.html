layout: false
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片来源说明</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            max-width: 650px;
            margin: 0 auto;
            padding: 60px 20px;
            background: #ffffff;
            color: #222222;
            line-height: 1.7;
        }

        header {
            margin-bottom: 50px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888888;
            font-size: 0.9rem;
        }

        /* 列表条目样式 */
        .item {
            padding: 20px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .item:first-of-type {
            border-top: 1px solid #eeeeee;
        }

        .item-title {
            font-weight: 500;
            font-size: 1rem;
            color: #111111;
        }

        .item-meta {
            font-size: 0.85rem;
            color: #666666;
            margin-top: 4px;
        }

        .item-meta span {
            margin-right: 15px;
        }

        /* 极简链接样式 */
        a {
            color: #222222;
            text-decoration: none;
            border-bottom: 1px solid #888888;
            transition: all 0.2s;
        }

        a:hover {
            color: #49b1f5; /* 微微呼应 Butterfly 主色 */
            border-bottom-color: #49b1f5;
        }

        footer {
            margin-top: 50px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>图片来源声明</h1>
        <p class="subtitle">本站部分图片基于公开授权协议使用，在此对原作者致谢。</p>
    </header>

    <main>
        <!-- 条目 1 -->
        <div class="item">
            <div class="item-title">主页大图 - 优胜美地</div>
            <div class="item-meta">
                <span>作者: <a href="https://unsplash.com/@username" target="_blank">Ansel</a></span>
                <span>来源: Unsplash</span>
                <span>协议: Free License</span>
            </div>
        </div>

        <!-- 条目 2 -->
        <div class="item">
            <div class="item-title">关于页背景 - 独立插画</div>
            <div class="item-meta">
                <span>作者: <a href="#" target="_blank">Jane Doe</a></span>
                <span>来源: 本地上传</span>
                <span>协议: CC BY-NC 4.0</span>
            </div>
        </div>

        <!-- 条目 3 -->
        <div class="item">
            <div class="item-title">文章《Hexo教程》配图</div>
            <div class="item-meta">
                <span>作者: <a href="#" target="_blank">Storyset</a></span>
                <span>来源: Freepik</span>
                <span>协议: 需署名</span>
            </div>
        </div>
    </main>

    <footer>
        <a href="/">← 返回首页</a>
    </footer>

</body>
</html>
